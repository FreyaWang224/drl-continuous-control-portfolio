[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "drl-continuous-control-portfolio"
version = "0.1.0"
description = "Udacity Reacher continuous-control portfolio"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "grpcio==1.80.0", "protobuf==3.20.3", "Pillow>=9", "torch==2.8.0", "matplotlib>=3.9,<4"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[project.scripts]
reacher-smoke = "continuous_control.smoke:main"
reacher-control = "continuous_control.cli:main"
reacher-results = "continuous_control.results:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
